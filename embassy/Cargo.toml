[package]
name = "rust_interrupts_embassy"
version = "0.1.0"
edition = "2024"

[dependencies]
cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.5"
cortex-m-semihosting = "0.5.0"
embassy-executor = { version = "0.8.0", features = ["arch-cortex-m", "executor-thread"] }
embassy-stm32 = { version = "0.3.0", features = ["exti", "rt", "stm32f303vc", "time-driver-any"] }
embassy-time = "0.4.0"
panic-semihosting = "0.6.0"

[profile.release]
panic = "abort"
codegen-units = 1
debug = true
lto = true

[profile.dev]
panic = "abort"

